<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="style.css" rel="stylesheet">

  <title>Find Your Lucky Dog</title>
</head>

<body>
  <main>
    <h1>Find Your Lucky Dog in Tandon</h1>

    <p id="status">
      A lucky dog is waiting at the dog statue in Tandon.
    </p>

    <button id="locationButton">
      Check My Location
    </button>

    <section id="dogResult" hidden>
      <img id="luckyDog" src="" alt="Your lucky dog">

      <button id="anotherDogButton">
        Meet Another Dog
      </button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
